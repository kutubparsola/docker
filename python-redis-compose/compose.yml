# webapps: and image: is used to name where webapp is used to name the service so when you do curl www.webapps:5000 it will repond on the same way  image is used to name the image that you built it will be staored with the image name you gave

# depends-on: says  that if the the mentioned container starts then only this container will start here if the redis manages to start successfully then only the python will start else not 
