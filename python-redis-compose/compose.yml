services:
  webapp:
    build: .
    image: python_app_img
    container_name: python_app_con
    volumes:
      - pythonvol:/app/logs
    ports:
      - 5000:5000
    depends_on:
      - redis_img

  redis_img:
    image: redis:8-alpine
    container_name: redis_con
  volumes:
    - pythonvol:{}

